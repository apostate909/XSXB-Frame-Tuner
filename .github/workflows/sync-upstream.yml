name: Manual sync fork with upstream

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main branch from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync "${GITHUB_REPOSITORY}" \
            --source "sparklecatta-lang/XSXB-Frame-Tuner" \
            --branch main
